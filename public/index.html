<!DOCTYPE html>
<html>
<head>
  <title>Dream Archive</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>Dream Archive</h1>

  <p>What do you remember from your dream?</p>

  <input id="dreamInput" type="text" placeholder="Write a dream fragment">

  <button id="submitButton">Archive Dream</button>

  <p id="message"></p>

  <hr>

  <h2>Dream Fragments</h2>

  <button id="showButton">Open Archive</button>

  <div id="dreamList"></div>

  <script src="script.js"></script>

</body>
</html>
